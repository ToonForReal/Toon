<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>In The Park</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html,body{height:100%;margin:0} canvas{display:block}</style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
// ------------------ Scene Setup ------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(-1, 7, -8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

// ------------------ Lights ------------------
const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(2, 2,-10);
dir.castShadow = true;
scene.add(dir);

// ------------------ Ground ------------------
const textureLoader = new THREE.TextureLoader();
const groundTexture = textureLoader.load('https://toonforreal.github.io/Toon/concrete_pavement_diff_1k.jpg');
groundTexture.wrapS = THREE.RepeatWrapping;
groundTexture.wrapT = THREE.RepeatWrapping;
groundTexture.repeat.set(8, 8); // ทำให้ลายซ้ำ ดูไม่แตก

const groundMaterial = new THREE.MeshStandardMaterial({
  map: groundTexture,
  roughness: 1.0,
  metalness: 0.0,
});

const ground = new THREE.Mesh(
  new THREE.PlaneBufferGeometry(20, 20),
  groundMaterial
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);


// ------------------ Environment Map ------------------
const cubeUrls = [
  'https://toonforreal.github.io/Toon/posx.jpg',
  'https://toonforreal.github.io/Toon/negx.jpg',
  'https://toonforreal.github.io/Toon/posy.jpg',
  'https://toonforreal.github.io/Toon/negy.jpg',
  'https://toonforreal.github.io/Toon/posz.jpg',
  'https://toonforreal.github.io/Toon/negz.jpg'
];
const cubeTexture = new THREE.CubeTextureLoader().load(cubeUrls);
scene.background = cubeTexture;
scene.environment = cubeTexture;

// ------------------ ตัวแปร Animation ------------------
const clock = new THREE.Clock();
let mixer = null;

// ------------------ ✅ ฟังก์ชันโหลด GLB ------------------
function loadGLB(url, position = {x:0, y:0, z:0}, onLoad) {
  const loader = new THREE.GLTFLoader();
  loader.load(
    url,
    (gltf) => {
      const model = gltf.scene || gltf.scenes[0];
      model.position.set(position.x, position.y, position.z);

      model.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
          if (node.material && (node.material.isMeshStandardMaterial || node.material.isMeshPhysicalMaterial)) {
            node.material.cubeTexture = cubeTexture;
            node.material.needsUpdate = true;
          }
        }
      });

      // ถ้ามี animation
      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
      }

      scene.add(model);
      if (onLoad) onLoad(model);
    },
    undefined,
    (error) => console.error('Error loading GLB:', error)
  );
}

// ------------------ ฟังก์ชันปรับขนาดโมเดล ------------------
function scaleModel(model, scale = {x:1, y:1, z:1}) {
  model.scale.set(scale.x, scale.y, scale.z);
}

// ------------------ เรียกใช้งานฟังก์ชัน ------------------
loadGLB(
  'https://toonforreal.github.io/Toon/real-time_reflection_demo_chess_board_by_al.glb',
  { x: -0.6, y: 4, z: -1.6 },
  (model) => {
    scaleModel(model, { x: 0.1, y: 0.1, z: 0.1 });

    // 🎨 เปลี่ยนวัสดุเป็น PBR
    model.traverse((node) => {
      if (node.isMesh) {
        const oldMat = node.material;
        node.material = new THREE.MeshStandardMaterial({
          map: oldMat.map || null,
          normalMap: oldMat.normalMap || null,
          roughnessMap: oldMat.roughnessMap || null,
          metalnessMap: oldMat.metalnessMap || null,
          color: oldMat.color || new THREE.Color(0xffffff),
          roughness: 0,         // ผิวค่อนข้างมัน
          metalness: 1,         // เงาแบบโลหะ
          envMap: cubeTexture,    // ใช้แสงจาก environment
          envMapIntensity: 4.0    // เพิ่มความสะท้อน
        });
        node.material.needsUpdate = true;
      }
    });
  }
);
loadGLB('https://toonforreal.github.io/Toon/garden_table_and_chair.glb',
    {x:0, y:3, z:0}, (model) => {
    scaleModel(model, {x:5, y:5, z:5});
    // 🎨 เปลี่ยนวัสดุเป็น PBR
    model.traverse((node) => {
      if (node.isMesh) {
        const oldMat = node.material;
        node.material = new THREE.MeshStandardMaterial({
          map: oldMat.map || null,
          normalMap: oldMat.normalMap || null,
          roughnessMap: oldMat.roughnessMap || null,
          metalnessMap: oldMat.metalnessMap || null,
          color: oldMat.color || new THREE.Color(0xffffff),
          roughness: 2,         // ผิวค่อนข้างมัน
          metalness: 0,         // เงาแบบโลหะ
          envMap: cubeTexture,    // ใช้แสงจาก environment
          envMapIntensity: 1    // เพิ่มความสะท้อน
        });
        node.material.needsUpdate = true;
      }
    });
});

 loadGLB('https://toonforreal.github.io/Toon/name__2.glb', {x:0, y:3.6, z:2}, (model) => {
     scaleModel(model, {x:0.7, y:0.7, z:0.7});});
  

// ------------------ Resize ------------------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ------------------ Animate ------------------
let penguinModel_1 = null;
let penguinModel_2 = null;

loadGLB('https://toonforreal.github.io/Toon/penguin_2.0.glb',
  {x:-1.5, y:4.3, z:-0.1},
  (model) => {
    scaleModel(model, {x:0.02, y:0.02, z:0.02});
     const gradient = new THREE.TextureLoader().load('https://toonforreal.github.io/Toon/penguin_2.0.glbradient.png');
  model.traverse((node) => {
    if (node.isMesh) {
      const oldMat = node.material;
      node.material = new THREE.MeshToonMaterial({
        color: oldMat.color,
        map: oldMat.map,
        gradientMap: gradient
      });
    }
  });
    penguinModel_1 = model; // เก็บอ้างอิงไว้
  });

loadGLB('https://toonforreal.github.io/Toon/penguin_2.0.glb',
  {x:-1.5, y:3.6, z:-1},
  (model) => {
    scaleModel(model, {x:0.02, y:0.02, z:0.02});
    const gradient = new THREE.TextureLoader().load('https://toonforreal.github.io/Toon/penguin_2.0.glbradient.png');
  model.traverse((node) => {
    if (node.isMesh) {
      const oldMat = node.material;
      node.material = new THREE.MeshToonMaterial({
        color: oldMat.color,
        map: oldMat.map,
        gradientMap: gradient
      });
    }
  });
    penguinModel_2 = model; // เก็บอ้างอิงไว้
  });

// ใน loop 2
(function loop(){
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  
  // ให้เพนกวินกระดิกตัว 2
  if (penguinModel_2) {
    penguinModel_2.rotation.y -= 0.01;
    penguinModel_2.position.y = 3.6 + Math.sin(Date.now() * 0.01) * 0.1;
    if(penguinModel_2.position.y < 3.6){
        penguinModel_2.position.y = 3.6;        
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
// ใน loop 1
(function loop(){
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  
  // ให้เพนกวินกระดิกตัว 1
  if (penguinModel_1) {
    penguinModel_1.rotation.y += 0.01;
    penguinModel_1.position.y = 3.6 + Math.sin(Date.now() * 0.01) * 0.1;
    if(penguinModel_1.position.y < 3.6){
        penguinModel_1.position.y = 3.6;        
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();

let t = 0;
(function loop(){
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  t += 0.01;
  dir.position.x = 3 + Math.sin(t) * 1.0;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();

</script>
</body>
</html>
